name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the built app as the only Pages publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          legacy_runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=dynamic -f head_sha="$GITHUB_SHA" --jq '.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed") | .id')"
          for run_id in $legacy_runs; do
            if ! gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
              test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)" = "completed"
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
